<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran SCN 2026</title>
    <!-- Favicon opsional, bisa disesuaikan -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dvvjbnjzd/image/upload/v1788272339/logo_tmvffp.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah munculnya double scrollbar */
            background-color: #0a0f1d; /* Menyesuaikan dengan tema warna SCN 2026 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f5b700;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            z-index: 1;
        }

        .loading i {
            display: block;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 2;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="loading">
        Memuat Formulir Pendaftaran...
    </div>
    
    <!-- Atribut allow="camera" sangat penting agar fitur jepret foto (capture="environment") bisa berjalan di dalam iframe -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbz0w8QUKDcLZfKGbcNdNn7l8k-LzueSmhTRdJTuIDHQ8nEyycAZUDoR1AeZE84Ck74u/exec" 
        allow="camera" 
        title="Formulir Pendaftaran Sumedang Culinary Night 2026">
    </iframe>
</body>
</html>
