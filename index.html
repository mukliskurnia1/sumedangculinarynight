<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumedang Funtastic Walk 2026</title>
    <link rel="icon" href="https://res.cloudinary.com/dvvjbnjzd/image/upload/v1781416074/header_14062026_a8zpnh.jpg" type="image/png">
    <style>
        /* Menghilangkan margin dan scrollbar bawaan agar iframe tampil penuh 100% di layar hp/laptop */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f4f7f6; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }
  </style>
</head>
<body>

    <iframe id="appFrame" src=""></iframe>

    <script>
        // URL Google Apps Script Utama
        var googleScriptUrl = "https://script.google.com/macros/s/AKfycbz0w8QUKDcLZfKGbcNdNn7l8k-LzueSmhTRdJTuIDHQ8nEyycAZUDoR1AeZE84Ck74u/exec";

        // Menangkap parameter dari domain utama (Misal: ?page=surat_kuasa atau ?page=susulan)
        var currentParams = window.location.search || "";

        // Penggabungan URL yang aman agar parameter tidak rusak saat dimuat oleh iframe
        var finalUrl = googleScriptUrl + currentParams;

        // Memasukkan URL final ke dalam src iframe
        document.getElementById("appFrame").src = finalUrl;
    </script>

</body>
</html>
